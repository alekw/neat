<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEAT F-PROMETHEE II total order</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>NEAT F-PROMETHEE II total order</h1>


    <script src='https://cdn.plot.ly/plotly-3.6.0.min.js'></script>
    <div id="Phi"></div>
    <div id="Phi+"></div>
    <div id="Phi-"></div>
    <div id="data-table-container"></div>


    <script src="demo_payload.js"></script>
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        var raw = JSON.stringify(window.demoPayload);

        var requestOptions = {
            method: 'POST',
            headers: myHeaders,
            body: raw,
            redirect: 'follow'
        };

        fetch("http://127.0.0.1:7776/parse_json", requestOptions)
            .then(response => response.text())
            //.then(result => console.log(result))
            .then(result => {
                const data = JSON.parse(result);
                drawAll(data);
                renderFuzzySummaryTable(data);
                //renderCrispRankSummaryTable(data);
            })
            .catch(error => console.log('error', error));
    </script>



<script src="shared.js"></script>










































</body>

</html>
