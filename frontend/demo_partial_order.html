<!DOCTYPE html>
<html lang="en">

<head>
  <title>Partial order demo</title>
  <link rel="stylesheet" href="style.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <script src="https://unpkg.com/cytoscape/dist/cytoscape.umd.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@4.0.0/dist/cytoscape-dagre.min.js"></script>
</head>

<body>
  <h1>Partial order demo</h1>

  <div id="cy"></div>
  <script src="demo_payload.js"></script>
  <script src="shared.js"></script>

  <script>
    var myHeaders = new Headers();
    myHeaders.append("Content-Type", "application/json");

    var raw = JSON.stringify(window.demoPayload); 

    var requestOptions = {
      method: 'POST',
      headers: myHeaders,
      body: raw,
      redirect: 'follow'
    };

    fetch(window.NEAT_PARSE_JSON_URL, requestOptions)
      .then(response => response.text())
      .then(result => {
          const data = JSON.parse(result);
          drawPartialOrder(data);
          //renderFuzzySummaryTable(data);
          renderCrispRankSummaryTable(data);
      })
      .catch(error => console.log('error', error));

  </script>
  <div id="data-table-container"></div>
</body>
</html>
